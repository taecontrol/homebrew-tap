name: ci

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - Formula/manuvra.rb

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit, install, verify, and uninstall
        run: |
          brew tap --custom-remote taecontrol/tap "$GITHUB_WORKSPACE"
          brew trust --formula taecontrol/tap/manuvra
          brew audit --strict --online --tap taecontrol/tap
          brew install --formula taecontrol/tap/manuvra
          if version_json=$(manuvra version 2>/dev/null); then
            formula_version=$(brew info --json=v2 taecontrol/tap/manuvra | python3 -c 'import json, sys; print(json.load(sys.stdin)["formulae"][0]["versions"]["stable"])')
            test "$(python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])' <<< "$version_json")" = "$formula_version"
            manuvra schema job | python3 -c 'import json, sys; assert json.load(sys.stdin)["title"] == "Job"'
          else
            test "$(manuvra commands list --limit 1 | wc -c)" -le 4096
            test "$(manuvra daemon status | wc -c)" -le 4096
            codesign --verify --deep --strict --verbose=2 "$(brew --prefix manuvra)/libexec/Manuvra.app"
            manuvra daemon stop
          fi
          brew uninstall manuvra
